[project]
name = "subvox-motion-ctc"
version = "0.1.0"
description = "Local real-motion phoneme CTC training and decoding for Subvox"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "huggingface-hub>=0.34,<2",
    "numpy>=1.26,<3",
    "opencc-python-reimplemented>=0.1.7,<0.2",
    "phonemizer>=3.3,<4",
    "pyarrow>=16,<23",
    "pypinyin>=0.53,<1",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
]

[project.scripts]
subvox-ml = "subvox_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subvox_ml"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
