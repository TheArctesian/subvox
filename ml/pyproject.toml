[project]
name = "subvox-motion-ctc"
version = "0.1.0"
description = "Local real-motion phoneme CTC training and decoding for Subvox"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pyarrow>=16,<23",
    "torch>=2.5,<3",
]

[project.scripts]
subvox-ml = "subvox_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subvox_ml"]
