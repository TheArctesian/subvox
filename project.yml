name: Subvox
options:
  bundleIdPrefix: com.joeblau
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: K78G42H4U2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Subvox:
    type: application
    platform: macOS
    sources:
      - Subvox
      - path: Corpus
        type: folder
        buildPhase: resources
    info:
      path: Subvox/Info.plist
      properties:
        CFBundleDisplayName: Subvox
        LSApplicationCategoryType: public.app-category.developer-tools
        NSMotionUsageDescription: Subvox reads AirPods head-motion data to study whether mouthed words can be decoded into text.
        NSCameraUsageDescription: Subvox reads your lip and jaw shape from the camera while you record. Frames are processed on this Mac and only numeric points are saved, never images or video.
        ATSApplicationFontsPath: "."
        NSMicrophoneUsageDescription: Subvox uses your microphone to record practice runs for playback and to check the spoken part of paired recordings. Audio stays on this Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.subvox
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
    postBuildScripts:
      - name: Bundle pinned uv
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/uv"
        script: |
          "$SRCROOT/Tools/runtime/bundle-uv.sh" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/uv"
      - name: Bundle pinned whisper-server
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/whisper-server"
        script: |
          "$SRCROOT/Tools/runtime/bundle-whisper-server.sh" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/whisper-server"
      - name: Bundle pinned neural training runtime
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/SequenceRuntime"
        script: |
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/SequenceRuntime"
          mkdir -p "$destination/subvox_ml"
          cp "$SRCROOT/ml/pyproject.toml" "$SRCROOT/ml/uv.lock" "$destination/"
          cp "$SRCROOT/ml/subvox_ml/"*.py "$destination/subvox_ml/"
  SubvoxTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SubvoxTests]
    dependencies:
      - target: Subvox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.subvox.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Subvox:
    build:
      targets:
        Subvox: all
        SubvoxTests: [test]
    test:
      targets: [SubvoxTests]
